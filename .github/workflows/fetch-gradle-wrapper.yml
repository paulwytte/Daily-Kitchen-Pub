name: Fetch Gradle Wrapper Jar
on:
  push:
    branches: [ temp-gradle-wrapper ]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Gradle 8.9 wrapper jar
        run: |
          mkdir -p out
          curl -L --fail --retry 3 -o out/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          sha256sum out/gradle-wrapper.jar
      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.9
          path: out/gradle-wrapper.jar
