name: Build Daily Kitchen & Pub Fresh Android App

on:
  push:
    branches:
      - android-fresh-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.9
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Add Daily Kitchen & Pub logo
        run: |
          mkdir -p android-fresh/app/src/main/res/drawable
          curl -L --fail https://raw.githubusercontent.com/paulwytte/Daily-Kitchen-Pub/main/logo.png -o android-fresh/app/src/main/res/drawable/daily_kitchen_logo.png

      - name: Build APK and AAB
        working-directory: android-fresh
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyKitchenPub-debug-apk
          path: android-fresh/app/build/outputs/apk/debug/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DailyKitchenPub-release-aab
          path: android-fresh/app/build/outputs/bundle/release/*.aab
